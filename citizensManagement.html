			// Functions
			// function showAllCitizens(){
				
			// }
			function selectCitizensById(id, citizens){
				let sentence="";
				if(citizens[id] !== undefined){
					let name = citizens[id]["name"];
					let age = citizens[id]["age"];
					let gender = citizens[id]["gender"];
					let occupation = citizens[id]["occupation"];
					let address = citizens[id]["address"];
					sentence = `[QUERY SUCCESSFUL] \nID: ${id}, \nNAME: ${name}, \nAGE: ${age}, \nGENDER: ${gender}, \nOCCUPATION: ${occupation}, \nADDRESS: ${address}`;
				}else{
					sentence = `[QUERY FAILED] \nNO MATCHING CITIZEN WITH ID: ${id}`;
				}
				return sentence;
			}
			
			// Interactions
			const selectButton = document.getElementById("btn_select");		// selectButton → <button>
			const resultDiv = document.getElementById("result_blank");		// resultDiv    → <div>
			// Fixed - Input an id
			const inputId = document.getElementById("input_id");
			// Show the contents in resultDiv
			selectButton.addEventListener("click", function() {
				const select_id = inputId.value;
				const result = selectCitizensById(select_id, all_people);
			    // const result = selectCitizensById(1, all_people);		// available
				// const result = selectCitizensById(8, all_people);		// undefined
			    resultDiv.textContent = result;
			});
